AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CarteDeVoeuxDebiles - cartes de voeux deformees (React + Lambda .NET)

Parameters:
  DomainName:
    Type: String
    Default: ''
    Description: Domaine public (ex. cartesvoeuxdebiles.com). Vide = URL CloudFront par defaut.
  CertificateArn:
    Type: String
    Default: ''
    Description: ARN d'un certificat ACM en us-east-1 couvrant le domaine et www.<domaine>.
  HostedZoneId:
    Type: String
    Default: ''
    Description: Zone Route 53 du domaine. Si renseignee, les enregistrements DNS sont crees.
  WebAclArn:
    Type: String
    Default: ''
    Description: ARN du WAF (stack waf.yaml, en us-east-1) a associer a CloudFront. Vide = pas de WAF.

Conditions:
  HasWaf: !Not [!Equals [!Ref WebAclArn, '']]
  HasDomain: !And
    - !Not [!Equals [!Ref DomainName, '']]
    - !Not [!Equals [!Ref CertificateArn, '']]
  HasDns: !And
    - !Condition HasDomain
    - !Not [!Equals [!Ref HostedZoneId, '']]

Globals:
  Function:
    Runtime: dotnet8
    Architectures: [arm64]
    MemorySize: 2048
    Timeout: 29

Resources:
  # Photos envoyees et images generees : privees, supprimees au bout d'un jour.
  ImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: purge-apres-24h
            Status: Enabled
            ExpirationInDays: 1
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [POST, GET]
            AllowedHeaders: ['*']
            # Ne pas referencer la distribution ici : cycle HttpApi -> fonction -> bucket -> distribution -> HttpApi.
            # Sans domaine, '*' reste sur : chaque acces exige de toute facon une URL presignee.
            AllowedOrigins: !If
              - HasDomain
              - [!Sub 'https://${DomainName}', !Sub 'https://www.${DomainName}']
              - ['*']
            MaxAge: 3600

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/src/CarteDeVoeuxDebiles.Api/
      Handler: CarteDeVoeuxDebiles.Api
      # Plafond de facture si un bot boucle sur /api/cards : au-dela, les requetes sont refusees (429).
      ReservedConcurrentExecutions: 20
      Environment:
        Variables:
          Storage__Mode: S3
          Storage__BucketName: !Ref ImagesBucket
          # Meme valeur que l'en-tete ajoute par CloudFront (voir Distribution) : l'API refuse les appels directs.
          OriginVerify__Secret: !Select [2, !Split ['/', !Ref AWS::StackId]]
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ImagesBucket
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/{proxy+}
            Method: ANY

  ApiFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ApiFunction}
      RetentionInDays: 14

  # Site React statique, servi uniquement via CloudFront.
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${WebsiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  WebsiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-site'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # S3 ne sert pas index.html pour un dossier : /en/ devient /en/index.html.
  IndexRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-index-rewrite'
      AutoPublish: true
      FunctionConfig:
        Comment: Dossiers vers index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function redirect(location) {
          return { statusCode: 301, statusDescription: 'Moved Permanently', headers: { location: { value: location } } };
        }
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          var host = request.headers.host ? request.headers.host.value : '';
          // Une seule URL par page pour Google : www -> domaine nu, /en -> /en/.
          if (host.indexOf('www.') === 0) {
            return redirect('https://' + host.substring(4) + uri);
          }
          if (uri === '/en') {
            return redirect('/en/');
          }
          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
          } else if (uri.lastIndexOf('.') < uri.lastIndexOf('/')) {
            request.uri = uri + '/index.html';
          }
          return request;
        }

  # En-tetes de securite sur toutes les reponses. La CSP n'autorise que :
  # - les scripts du site (Umami est copie localement) et le WebAssembly du detourage ('wasm-unsafe-eval') ;
  # - Google Fonts ; les styles inline (attributs style de React, page d'impression) ;
  # - le bucket d'images (envoi presigne, affichage des resultats) et l'API d'Umami.
  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-security-headers'
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Sub >-
              default-src 'self';
              script-src 'self' 'wasm-unsafe-eval';
              style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
              font-src 'self' https://fonts.gstatic.com;
              img-src 'self' data: blob: https://${ImagesBucket.RegionalDomainName} https://${ImagesBucket.DomainName};
              connect-src 'self' https://${ImagesBucket.RegionalDomainName} https://${ImagesBucket.DomainName} https://gateway.umami.is;
              worker-src 'self' blob:;
              object-src 'none';
              base-uri 'self';
              form-action 'self';
              frame-ancestors 'none';
              upgrade-insecure-requests
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
              Override: true

  # Un seul domaine : / -> site React, /api/* -> Lambda. Pas de CORS a gerer pour l'API.
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: CarteDeVoeuxDebiles
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        WebACLId: !If [HasWaf, !Ref WebAclArn, !Ref AWS::NoValue]
        Aliases: !If
          - HasDomain
          - [!Ref DomainName, !Sub 'www.${DomainName}']
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: site
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebsiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: api
            DomainName: !Sub '${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
            # Prouve a l'API que la requete vient de CloudFront (et a donc passe le WAF). Remplace tout en-tete
            # du meme nom envoye par le visiteur. Partie aleatoire de l'ID de stack : stable, jamais exposee au site.
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Select [2, !Split ['/', !Ref AWS::StackId]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt IndexRewriteFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy

  DnsRecords:
    Type: AWS::Route53::RecordSetGroup
    Condition: HasDns
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        # Z2FDTNDATAQYW2 : identifiant de zone fixe de CloudFront pour les alias.
        - Name: !Ref DomainName
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
        - Name: !Ref DomainName
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
        - Name: !Sub 'www.${DomainName}'
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
        - Name: !Sub 'www.${DomainName}'
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  SiteUrl:
    Value: !If [HasDomain, !Sub 'https://${DomainName}', !Sub 'https://${Distribution.DomainName}']
  DistributionId:
    Value: !Ref Distribution
  WebsiteBucketName:
    Value: !Ref WebsiteBucket
  ImagesBucketName:
    Value: !Ref ImagesBucket
